# Runs every check on GitHub's computers for each push and pull request.
# Results show up in the repo's "Actions" tab and as a ✓ or ✗ next to commits.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A throwaway Postgres just for this CI run, like the one in compose.yaml
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: showcase
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: showcase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U showcase"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway database and fake key: CI never touches real data or Steam
      DATABASE_URL: postgresql+psycopg://showcase:ci-only-password@localhost:5432/showcase_test
      STEAM_API_KEY: ci-fake-key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check migrations work on Postgres and match the models
        run: |
          alembic upgrade head
          alembic check

      - name: Test (SQLite)
        run: pytest

      - name: Test (Postgres)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://showcase:ci-only-password@localhost:5432/showcase_test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Type-check and build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the images
        run: docker compose build

      - name: Build the images
        env:
          POSTGRES_PASSWORD: ci-only-password # compose.yaml requires one to be set
        run: docker compose build

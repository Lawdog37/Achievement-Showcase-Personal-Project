# Dependabot opens pull requests when the packages, Docker images or GitHub
# Actions we use get updates (including security fixes). CI tests each one,
# so you can merge them with confidence. Updates are grouped to keep it to
# about one PR per area per week.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-packages:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-packages:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

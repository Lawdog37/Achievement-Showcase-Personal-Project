# Security headers: instructions that tell browsers to block common attacks.
# Included from nginx.conf. "always" adds them to error responses too.

# Only run scripts and load files from our own site; images may also come from
# Steam's image servers. This blocks most cross-site scripting (XSS) attacks.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.steamstatic.com https://*.akamaihd.net https://media.steampowered.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# Don't let other sites show our pages inside a frame (stops "clickjacking")
add_header X-Frame-Options "DENY" always;

# Trust the file types we declare; don't let the browser guess
add_header X-Content-Type-Options "nosniff" always;

# When following a link to another site, only tell it our domain, not the full URL
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# We never use the camera, microphone or location, so switch them off entirely
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

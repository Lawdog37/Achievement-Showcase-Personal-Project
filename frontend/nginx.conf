# nginx does in production what Vite's proxy does in development:
# serve the React app, and pass /api requests to the backend container.

# Rate limits, counted per visitor (IP address). "10m" is the memory used to
# remember visitors (about 160,000 of them), not 10 minutes.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;  # normal API use
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;  # sign-in attempts
limit_req_status 429;  # "Too Many Requests"

# Behind Cloudflare Tunnel, every request reaches nginx from the tunnel container,
# so all visitors would look like one person and share one rate limit. Cloudflare
# puts the real visitor's address in the CF-Connecting-IP header. Only believe that
# header when the request comes from a private (Docker) network, never from outside.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;  # don't advertise the nginx version to attackers

    include /etc/nginx/snippets/security-headers.conf;

    # Starting a sign-in: a few per minute is plenty for a real person
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API requests go to the backend. "backend" is the service name in
    # compose.yaml; Docker's internal network turns it into an address.
    location /api/ {
        limit_req zone=api burst=20 nodelay;  # short bursts are fine, floods aren't
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Built files have a content hash in their name, so browsers can cache them forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Gotcha: an add_header here cancels the server-level ones above,
        # so the security headers must be included again
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Any other path (like /player/7656...) is a React Router page:
    # send index.html and let React show the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
